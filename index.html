const MAP=[["美利樓建成於 1846／1844 年，英軍居所","M01／M06","來源"],["1850 年代鼠疫、英軍死亡","M03、M06","來源"],["1941 年日軍憲兵部，據稱四千人","M03、M06","來源（傳說）"],["1945 年英軍軍官餐廳，1961 年交政府（M01：1962）","M03、M01","來源（年份不一）"],["拆卸時工人倒地","M03","來源"],["差餉署 1963 年遷入","M03（M01：1962；M06：1975）","來源（年份不一）；「4月」為設定"],["廁所下的雙腳、無頭鬼","M01","來源"],["女職員聽到哭聲（未用）","M03","來源"],["Jessica、曬圖機、墨水、技術員、Wyman 等人物與對白","—","虛構"],["牧師和神父驅鬼","M06（六十年代初）","來源；對白虛構"],["打字機被搬到地上","M03（1974 運輸署）、M06（七十年代）","來源，但年份與部門被改編"],["馬路交通意外","M03、M06","來源；Jayden 被撞為虛構"],["差餉署向華民政務司報告，再聯繫佛教聯會","M03","來源；對白虛構"],["1974 年佛教超渡儀式","M03、M06","來源"],["1963 年 56 名高僧（劇本沒有這幕）","M01","來源，未使用"],["報章標題「中外何分…」","P02（剪報）","來源（標題）"],["批准人、款項、內部討論","—","資料未有記載"]];
function srcPanel(){const p=$("panel");p.style.display="block";modal=true;p.innerHTML=`<h3>史料對照</h3>`+MAP.map(r=>`<div class="row"><b>${r[0]}</b><br><span class="src">${r[1]}</span>　<span class="${r[2].startsWith("虛構")||r[2].includes("虛構")?"fic":"src"}">${r[2]}</span></div>`).join("")+`<button id="cl">關閉</button>`;$("cl").onclick=()=>{p.style.display="none";modal=!!window._m};window._m=0}
$("bSrc").onclick=()=>{window._m=modal;srcPanel()};
/* ---------- 輸入與更新 ---------- */
addEventListener("keydown",e=>{audio();const k=e.key.toLowerCase();
if((k==" "||k=="enter")&&$("ctx").style.display=="block"){$("ctx").click();e.preventDefault();return}
if(modal&&(k==" "||k=="enter")){const b=$("bn");if(b&&$("dlg").style.display=="block"){b.click();e.preventDefault()}return}
if(modal&&$("dlg").style.display=="block"&&/^[1-4]$/.test(k)){const b=$("dlg").querySelector(`[data-i="${+k-1}"]`);b&&b.click();return}
keys[k]=1;if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k))e.preventDefault();
if(!modal&&(k==" "||k=="enter")){const h=near();if(h)h.act()}});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
document.querySelectorAll("#dpad button").forEach(b=>{const k=b.dataset.k.toLowerCase();
b.addEventListener("touchstart",e=>{e.preventDefault();audio();if(k==" "){if(modal){const n=$("bn");n&&n.click()}else{const h=near();h&&h.act()}}else keys[k]=1});
b.addEventListener("touchend",()=>keys[k]=0)});
function near(){return S.hots.find(h=>Math.abs(P.x-h.x)<28&&Math.abs(P.y-h.y)<20)}
function blocked(x,y){const c=SC[S.scene];return c.blk.some(b=>x>b[0]&&x<b[0]+b[2]&&y>b[1]&&y<b[1]+b[3])}
function sp(k,s){return pic[k+"_"+s]}
function drawEnt(k,x,y,s,flip,e){const im=sp(k,s);if(!im||!im.complete)return;const w=im.width,h=im.height;
g.save();if(flip){g.translate(x,0);g.scale(-1,1);g.drawImage(im,-w/2,y-h)}else g.drawImage(im,x-w/2,y-h);g.restore();
if(e&&e.ink){g.fillStyle="#05060a";g.fillRect(x+(flip?-12:7),y-s*.42,5,5);g.fillRect(x+(flip?-9:5),y-s*.34,3,3)}
if(e&&e.bang&&e.bang>Date.now()){g.fillStyle="#ffdd44";g.font="bold 14px sans-serif";g.fillText("!",x-3,y-s-4)}
if(e&&e.bubble&&e.bu>Date.now()){const t=e.bubble;g.font="9px sans-serif";const w2=g.measureText(t).width+8;g.fillStyle="#fff";g.fillRect(x-w2/2,y-s-22,w2,14);g.fillStyle="#111";g.fillText(t,x-w2/2+4,y-s-12)}}
function draw(){T++;g.save();if(shakeT>0&&!safe){g.translate((Math.random()-.5)*5,(Math.random()-.5)*5);shakeT--}
const c=SC[S.scene],bg=pic[c.bg];g.fillStyle="#000";g.fillRect(0,0,W,H);if(bg&&bg.complete)g.drawImage(bg,0,0,W,H);
const cs=c.cs,list=[];
S.ents.forEach(e=>list.push({y:e.y,f:()=>{if(e.ghost&&!safe&&T%90<6)return;drawEnt(e.k,e.x,e.y,cs,e.flip,e)}}));
S.props.forEach(p=>list.push({y:p.y,f:()=>{const im=pic[p.k];if(im&&im.complete){const w=im.width,h=im.height;g.drawImage(im,p.x-w/2,p.y-h,w,h)}}}));
list.push({y:P.y,f:()=>drawEnt("M4",P.x,P.y,cs,P.face<0)});list.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
if(S.scene=="toilet"){S.feet.forEach(i=>{const im=pic.feet;if(im.complete)g.drawImage(im,56+i*80+28,160)})}
if(S.scene=="office"){const f=pic.fg_office;if(f&&f.complete)g.drawImage(f,0,0,W,H)}
if(S.scene=="office"){const cl=pic.clock;if(cl&&cl.complete)g.drawImage(cl,174,22);const bd=pic.board;if(bd&&bd.complete)g.drawImage(bd,126,28)}
if(S.night){g.globalAlpha=.55;g.fillStyle="#02030c";g.fillRect(0,0,W,H);g.globalAlpha=1}
const fl=(!safe&&Math.random()<.03)?.35:0;if(fl){g.globalAlpha=fl;g.fillStyle="#000";g.fillRect(0,0,W,H);g.globalAlpha=1}
const vg=g.createRadialGradient(P.x,P.y-20,40,P.x,P.y-20,230);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,12,.55)");g.fillStyle=vg;g.fillRect(0,0,W,H);
const h=near();if(h&&!modal){g.strokeStyle="#ffdd44";g.beginPath();g.ellipse(h.x,h.y,14,5,0,0,6.3);g.stroke()}
g.restore();
$("hint").textContent=modal?"":(h?`[Space/Enter] ${h.label}`:(S.hintTxt||"方向鍵／WASD 移動"))}
function loop(){if(!modal){const sp2=1.5;let dx=0,dy=0;
if(keys.arrowleft||keys.a)dx-=sp2;if(keys.arrowright||keys.d)dx+=sp2;if(keys.arrowup||keys.w)dy-=sp2;if(keys.arrowdown||keys.s)dy+=sp2;
const c=SC[S.scene];if(dx)P.face=dx;
let nx=Math.max(c.x[0],Math.min(c.x[1],P.x+dx)),ny=Math.max(c.y[0],Math.min(c.y[1],P.y+dy));
if(!blocked(nx,P.y))P.x=nx;if(!blocked(P.x,ny))P.y=ny;if((dx||dy)&&T%14==0)blip(70,.08,.015)}
S.ents.forEach(e=>{if(e.tx!==undefined){const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);if(d<1.5){e.x=e.tx;e.y=e.ty;e.tx=undefined;const f=e.cb;e.cb=null;f&&f()}else{e.x+=dx/d*1.2;e.y+=dy/d*1.2}}});
draw();requestAnimationFrame(loop)}
go("office",190,180,[],[],{});title();loop();
